<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Kanban Board (Cloud Edition)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 900: '#0f172a', 800: '#1e293b', 700: '#334155', 600: '#475569' }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome ikonky -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .kanban-column { min-width: 300px; max-width: 300px; transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .dragging { opacity: 0.3; transform: scale(0.95) rotate(-1deg); }
        .drag-over { border: 2px dashed #38bdf8 !important; background-color: rgba(56, 189, 248, 0.05); }
        .ticket-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .ticket-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px -4px rgba(0,0,0,0.5); }
        .ticket-drag-over { border-top: 3px solid #38bdf8 !important; }
        .color-dot.selected { ring: 2px solid white; transform: scale(1.15); }
    </style>
</head>
<body class="bg-dark-900 text-slate-100 min-h-screen flex flex-col font-sans select-none">

    <!-- LOGIN MODAL -->
    <div id="auth-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center z-50 p-4">
        <div class="bg-dark-800 border border-dark-700 rounded-2xl w-full max-w-sm p-8 shadow-2xl text-center space-y-6">
            <div class="w-16 h-16 bg-cyan-500/10 text-cyan-400 rounded-2xl mx-auto flex items-center justify-center text-2xl border border-cyan-500/20 shadow-inner">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <div>
                <h2 class="text-xl font-bold text-white mb-1">Vstup do pevnosti</h2>
                <p class="text-xs text-slate-400">Zadej heslo, jinak neprojdeš!</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <input type="password" id="password-input" placeholder="Tajné heslo..." required class="w-full bg-dark-900 border border-dark-700 rounded-xl px-4 py-3 text-white text-center tracking-widest focus:outline-none focus:border-cyan-500">
                <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white py-3 rounded-xl text-sm font-medium transition shadow-lg shadow-cyan-600/20">Odemknout bránu</button>
            </form>
            <p id="login-error" class="text-xs text-red-400 hidden">Špatné heslo, zkus to znovu!</p>
        </div>
    </div>

    <!-- HLAVIČKA -->
    <header class="bg-dark-800 border-b border-dark-700 px-6 py-4 flex flex-col gap-4 shadow-lg">
        <div class="flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-cloud text-cyan-400 text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wider text-white">CLOUD KANBAN BOARD</h1>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="openColumnModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-md flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Nový sloupec
                </button>
                <button onclick="openModal()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-md flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Nový ticket
                </button>
                <button onclick="logout()" title="Zamknout aplikaci" class="text-slate-400 hover:text-red-400 p-2 rounded-xl bg-dark-700/50 transition">
                    <i class="fa-solid fa-lock"></i>
                </button>
            </div>
        </div>

        <!-- FILTRY -->
        <div class="flex items-center gap-3 flex-wrap bg-dark-900/60 p-3 rounded-2xl border border-dark-700/50">
            <div class="relative flex-1 min-w-[200px]">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                <input type="text" id="search-input" oninput="applyFilters()" placeholder="Hledat ticket..." class="w-full bg-dark-800 border border-dark-700 rounded-xl pl-9 pr-3 py-1.5 text-xs text-white focus:outline-none focus:border-cyan-500">
            </div>
            <select id="filter-assignee" onchange="applyFilters()" class="bg-dark-800 border border-dark-700 rounded-xl px-3 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-cyan-500">
                <option value="">Všichni lidé</option>
            </select>
            <select id="filter-priority" onchange="applyFilters()" class="bg-dark-800 border border-dark-700 rounded-xl px-3 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-cyan-500">
                <option value="">Všechny priority</option>
                <option value="low">Pohodička (Low)</option>
                <option value="medium">Normál (Medium)</option>
                <option value="high">Horečka (High)</option>
            </select>
            <select id="filter-tag" onchange="applyFilters()" class="bg-dark-800 border border-dark-700 rounded-xl px-3 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-cyan-500">
                <option value="">Všechny štítky</option>
            </select>
            <button onclick="resetFilters()" class="text-xs text-slate-400 hover:text-white px-2 py-1 transition"><i class="fa-solid fa-rotate-left mr-1"></i>Reset</button>
        </div>
    </header>

    <!-- HLAVNÍ KANBAN BOARD -->
    <main class="flex-1 p-6 overflow-x-auto flex items-start gap-6" id="kanban-board">
        <!-- Sem se dynamicky vykreslí sloupce -->
    </main>

    <!-- MODAL PRO KARTU -->
    <div id="ticket-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-dark-800 border border-dark-700 rounded-2xl w-full max-w-lg p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto space-y-4">
            <h2 id="modal-title" class="text-lg font-bold text-white">Nový ticket</h2>
            <form id="ticket-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="ticket-id">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Název</label>
                    <input type="text" id="ticket-title-input" required class="w-full bg-dark-900 border border-dark-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Popis</label>
                    <textarea id="ticket-desc-input" rows="3" class="w-full bg-dark-900 border border-dark-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-cyan-500"></textarea>
                </div>

                <!-- BAREVNÁ PALETKA -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Barva ticketu</label>
                    <div class="flex items-center gap-2 flex-wrap mb-2" id="color-picker-container"></div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-slate-500">Vlastní HEX:</span>
                        <input type="color" id="custom-color-picker" onchange="selectCustomColor(this.value)" class="w-7 h-7 rounded bg-transparent cursor-pointer border-0">
                        <input type="text" id="ticket-color-hex" placeholder="#38bdf8" class="w-28 bg-dark-900 border border-dark-700 rounded-lg px-2 py-1 text-xs text-white focus:outline-none" onchange="selectCustomColor(this.value)">
                    </div>
                </div>

                <!-- ŠTÍTKY -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Štítky (Odděluj čárkou)</label>
                    <input type="text" id="ticket-tags-input" placeholder="Design, Bug, Urgent" class="w-full bg-dark-900 border border-dark-700 rounded-xl px-4 py-2 text-white text-xs focus:outline-none focus:border-cyan-500">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Priorita</label>
                        <select id="ticket-priority-input" class="w-full bg-dark-900 border border-dark-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-cyan-500">
                            <option value="low">Pohodička (Low)</option>
                            <option value="medium">Normál (Medium)</option>
                            <option value="high">Horečka (High)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Přiřazeno</label>
                        <input type="text" id="ticket-assignee-input" placeholder="Kdo na tom maká" class="w-full bg-dark-900 border border-dark-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-cyan-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Deadline (Do kdy hotovo)</label>
                    <input type="date" id="ticket-deadline-input" class="w-full bg-dark-900 border border-dark-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-cyan-500">
                </div>

                <!-- KOMENTÁŘE A HISTORIE -->
                <div id="modal-extra-section" class="hidden border-t border-dark-700 pt-4 space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-2"><i class="fa-regular fa-comments mr-1"></i>Komentáře</label>
                        <div id="comments-list" class="space-y-2 mb-3 max-h-32 overflow-y-auto pr-1"></div>
                        <div class="flex gap-2">
                            <input type="text" id="new-comment-input" placeholder="Přidat poznámku..." class="flex-1 bg-dark-900 border border-dark-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none">
                            <button type="button" onclick="addComment()" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-xl text-xs">Odeslat</button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-2"><i class="fa-solid fa-timeline mr-1"></i>Historie aktivit</label>
                        <div id="history-list" class="space-y-1 max-h-28 overflow-y-auto text-[11px] text-slate-400 border border-dark-700/50 p-2 rounded-xl bg-dark-900/50"></div>
                    </div>
                </div>

                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-400 hover:text-white transition">Zrušit</button>
                    <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 text-white px-5 py-2 rounded-xl text-sm font-medium transition">Uložit</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL PRO SLOUPEC -->
    <div id="column-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-dark-800 border border-dark-700 rounded-2xl w-full max-w-sm p-6 shadow-2xl relative">
            <h2 class="text-lg font-bold mb-4 text-white">Přidat nový sloupec</h2>
            <form onsubmit="handleColumnSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Název sloupce</label>
                    <input type="text" id="column-title-input" required class="w-full bg-dark-900 border border-dark-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="closeColumnModal()" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-400 hover:text-white transition">Zrušit</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-xl text-sm font-medium transition">Vytvořit</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL PRO MAZÁNÍ SLOUPCE -->
    <div id="delete-column-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-dark-800 border border-dark-700 rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
            <h2 class="text-lg font-bold mb-2 text-white">Smazat sloupec?</h2>
            <p class="text-sm text-slate-400 mb-4">Co chceš udělat s kartama uvnitř tohoto sloupce?</p>
            <input type="hidden" id="delete-column-id">
            <div class="space-y-3">
                <button onclick="confirmDeleteColumn('delete')" class="w-full bg-red-600/20 hover:bg-red-600/30 border border-red-500/30 text-red-400 p-3 rounded-xl text-sm font-medium text-left transition flex items-center justify-between">
                    <span>Smazat sloupec i s kartami</span>
                    <i class="fa-solid fa-trash"></i>
                </button>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Nebo převést karty do jiného sloupce:</label>
                    <div class="flex gap-2">
                        <select id="transfer-target-select" class="flex-1 bg-dark-900 border border-dark-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none"></select>
                        <button onclick="confirmDeleteColumn('transfer')" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition">Převést</button>
                    </div>
                </div>
            </div>
            <div class="flex justify-end mt-6">
                <button onclick="closeDeleteColumnModal()" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-400 hover:text-white transition">Zrušit</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        // === UPSTASH REDIS CONFIG (Doplň své údaje) ===
         const UPSTASH_URL = "https://epic-albacore-242233.upstash.io";
        const UPSTASH_TOKEN = "gQAAAAAAA7I5AAIgcDFkOTI1ZjAwNzNiZjE0ZGUzYjA2ODdjNmU0OTMxYjE4Zg";
        const REDIS_KEY = "kanban_tickets_data";

        const APP_PASSWORD = "mithril123";

        function handleLogin(e) {
            e.preventDefault();
            const val = document.getElementById("password-input").value;
            const err = document.getElementById("login-error");
            if (val === APP_PASSWORD) {
                sessionStorage.setItem("kanban_auth", "true");
                document.getElementById("auth-modal").classList.add("hidden");
                loadData();
            } else {
                err.classList.remove("hidden");
            }
        }

        function checkAuth() {
            if (sessionStorage.getItem("kanban_auth") === "true") {
                document.getElementById("auth-modal").classList.add("hidden");
                loadData();
            } else {
                document.getElementById("auth-modal").classList.remove("hidden");
            }
        }

        function logout() {
            sessionStorage.removeItem("kanban_auth");
            location.reload();
        }

        const COLOR_PALETTE = [
            { name: "Cyan", hex: "#38bdf8" },
            { name: "Purple", hex: "#c084fc" },
            { name: "Pink", hex: "#f472b6" },
            { name: "Emerald", hex: "#34d399" },
            { name: "Amber", hex: "#fbbf24" },
            { name: "Coral", hex: "#fb7185" },
            { name: "Indigo", hex: "#818cf8" },
            { name: "Slate", hex: "#94a3b8" }
        ];

        let selectedColorHex = "#38bdf8";

        let appData = {
            columns: [
                { id: "col-1", title: "Backlog" },
                { id: "col-2", title: "In Progress" },
                { id: "col-3", title: "Done" }
            ],
            tickets: [
                { 
                    id: "t-1", 
                    columnId: "col-1", 
                    title: "Zničit Prsten Moci", 
                    description: "Hmotnost prstenu je velká, pozor na skřety.", 
                    priority: "high", 
                    assignee: "Frodo",
                    color: "#f472b6",
                    tags: ["Mordor", "Urgent"],
                    createdAt: "2026-10-25",
                    deadline: "2026-10-31",
                    completedAt: null,
                    comments: [{ text: "Gollum nás sleduje...", time: "2026-10-26 14:20" }],
                    history: [{ text: "Ticket vytvořen", time: "2026-10-25 10:00" }]
                }
            ]
        };

        // --- UPSTASH NAČTENÍ DAT ---
        async function loadData() {
            try {
                const response = await fetch(`${UPSTASH_URL}/get/${REDIS_KEY}`, {
                    headers: { Authorization: `Bearer ${UPSTASH_TOKEN}` }
                });
                const result = await response.json();
                if (result.result) {
                    appData = JSON.parse(result.result);
                }
            } catch (e) {
                console.error("Chyba při stahování z Upstachu, jedeme lokálně", e);
            }
            renderBoard();
            initColorPicker();
            updateFilterDropdowns();
        }

        // --- UPSTASH ULOŽENÍ DAT ---
        async function saveData() {
            renderBoard();
            updateFilterDropdowns();
            try {
                await fetch(`${UPSTASH_URL}/set/${REDIS_KEY}`, {
                    method: 'POST',
                    headers: {
                        Authorization: `Bearer ${UPSTASH_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(JSON.stringify(appData))
                });
            } catch (e) {
                console.error("Chyba při ukládání na Upstash", e);
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return null;
            const d = new Date(dateStr);
            return d.toLocaleDateString('cs-CZ');
        }

        function nowFormatted() {
            const d = new Date();
            return d.toISOString().split('T')[0] + " " + d.toTimeString().split(' ')[0].substring(0, 5);
        }

        function initColorPicker() {
            const container = document.getElementById("color-picker-container");
            container.innerHTML = "";
            COLOR_PALETTE.forEach(c => {
                const dot = document.createElement("button");
                dot.type = "button";
                dot.className = `color-dot w-7 h-7 rounded-full border-2 border-transparent transition cursor-pointer`;
                dot.style.backgroundColor = c.hex;
                dot.setAttribute("data-hex", c.hex);
                dot.onclick = () => selectCustomColor(c.hex);
                container.appendChild(dot);
            });
        }

        function selectCustomColor(hex) {
            selectedColorHex = hex;
            document.getElementById("ticket-color-hex").value = hex;
            document.getElementById("custom-color-picker").value = hex.startsWith("#") ? hex : "#38bdf8";

            document.querySelectorAll(".color-dot").forEach(dot => {
                if (dot.getAttribute("data-hex").toLowerCase() === hex.toLowerCase()) {
                    dot.classList.add("selected");
                } else {
                    dot.classList.remove("selected");
                }
            });
        }

        function updateFilterDropdowns() {
            const assignees = new Set();
            const tags = new Set();

            appData.tickets.forEach(t => {
                if (t.assignee) assignees.add(t.assignee);
                if (t.tags) t.tags.forEach(tag => tags.add(tag));
            });

            const assigneeSelect = document.getElementById("filter-assignee");
            const currentAssignee = assigneeSelect.value;
            assigneeSelect.innerHTML = '<option value="">Všichni lidé</option>';
            assignees.forEach(a => {
                assigneeSelect.innerHTML += `<option value="${a}" ${a === currentAssignee ? 'selected' : ''}>${a}</option>`;
            });

            const tagSelect = document.getElementById("filter-tag");
            const currentTag = tagSelect.value;
            tagSelect.innerHTML = '<option value="">Všechny štítky</option>';
            tags.forEach(tg => {
                tagSelect.innerHTML += `<option value="${tg}" ${tg === currentTag ? 'selected' : ''}>${tg}</option>`;
            });
        }

        function applyFilters() { renderBoard(); }

        function resetFilters() {
            document.getElementById("search-input").value = "";
            document.getElementById("filter-assignee").value = "";
            document.getElementById("filter-priority").value = "";
            document.getElementById("filter-tag").value = "";
            renderBoard();
        }

        function moveTicketDirection(ticketId, direction) {
            const ticket = appData.tickets.find(t => t.id === ticketId);
            if (!ticket) return;

            const colIndex = appData.columns.findIndex(c => c.id === ticket.columnId);
            if (colIndex < 0) return;

            const newColIndex = colIndex + direction;
            if (newColIndex < 0 || newColIndex >= appData.columns.length) return;

            const oldColTitle = appData.columns[colIndex].title;
            const newColObj = appData.columns[newColIndex];
            
            ticket.columnId = newColObj.id;
            if (oldColTitle !== newColObj.title) {
                addHistory(ticket, `Přesunuto šipkou do "${newColObj.title}"`);
            }
            checkCompletionStatus(ticket, newColObj.id);
            saveData();
        }

        function renderBoard() {
            const board = document.getElementById("kanban-board");
            board.innerHTML = "";
            const todayStr = new Date().toISOString().split('T')[0];

            const searchQuery = document.getElementById("search-input") ? document.getElementById("search-input").value.toLowerCase() : "";
            const filterAssignee = document.getElementById("filter-assignee") ? document.getElementById("filter-assignee").value : "";
            const filterPriority = document.getElementById("filter-priority") ? document.getElementById("filter-priority").value : "";
            const filterTag = document.getElementById("filter-tag") ? document.getElementById("filter-tag").value : "";

            appData.columns.forEach((col, index) => {
                let colTickets = appData.tickets.filter(t => t.columnId === col.id);

                colTickets = colTickets.filter(t => {
                    const matchSearch = !searchQuery || t.title.toLowerCase().includes(searchQuery) || (t.description && t.description.toLowerCase().includes(searchQuery));
                    const matchAssignee = !filterAssignee || t.assignee === filterAssignee;
                    const matchPriority = !filterPriority || t.priority === filterPriority;
                    const matchTag = !filterTag || (t.tags && t.tags.includes(filterTag));
                    return matchSearch && matchAssignee && matchPriority && matchTag;
                });

                const colDiv = document.createElement("div");
                colDiv.className = "kanban-column bg-dark-800 border border-dark-700 rounded-2xl flex flex-col max-h-[calc(100vh-180px)] shadow-xl";
                colDiv.setAttribute("data-column-id", col.id);
                colDiv.setAttribute("draggable", "true");

                colDiv.addEventListener("dragstart", (e) => {
                    if (e.target !== colDiv) return;
                    e.dataTransfer.setData("text/column-id", col.id);
                    colDiv.classList.add("dragging");
                });
                colDiv.addEventListener("dragend", () => colDiv.classList.remove("dragging"));
                colDiv.addEventListener("dragover", (e) => e.preventDefault());
                colDiv.addEventListener("drop", (e) => {
                    e.preventDefault();
                    const draggedColId = e.dataTransfer.getData("text/column-id");
                    if (draggedColId && draggedColId !== col.id) {
                        moveColumnOrder(draggedColId, col.id);
                    }
                });

                let headerHtml = `
                    <div class="p-4 border-b border-dark-700 flex justify-between items-center cursor-grab active:cursor-grabbing">
                        <div class="flex items-center gap-2 flex-1 mr-2">
                            <span id="col-title-${col.id}" ondblclick="enableColumnRename('${col.id}')" title="Dvojklik pro přejmenování" class="font-bold text-white text-sm cursor-pointer hover:text-cyan-400 transition">
                                ${col.title}
                            </span>
                            <span class="text-xs px-2 py-0.5 rounded-full bg-dark-700 text-slate-400">${colTickets.length}</span>
                        </div>
                        <div class="flex items-center gap-1 text-slate-400">
                            ${index > 0 ? `<button onclick="moveColumnIndex('${col.id}', -1)" class="hover:text-white p-1"><i class="fa-solid fa-chevron-left text-xs"></i></button>` : ''}
                            ${index < appData.columns.length - 1 ? `<button onclick="moveColumnIndex('${col.id}', 1)" class="hover:text-white p-1"><i class="fa-solid fa-chevron-right text-xs"></i></button>` : ''}
                            <button onclick="promptDeleteColumn('${col.id}')" class="hover:text-red-400 p-1 ml-1"><i class="fa-solid fa-trash text-xs"></i></button>
                        </div>
                    </div>
                `;

                let ticketsHtml = `<div class="p-3 flex-1 overflow-y-auto space-y-3 column-drop-zone" ondragover="allowDrop(event)" ondragleave="removeDropStyle(event)" ondrop="dropTicket(event, '${col.id}')">`;
                
                colTickets.forEach(t => {
                    let priorityColor = "bg-slate-500/10 text-slate-400 border-slate-500/20";
                    if (t.priority === "medium") priorityColor = "bg-amber-500/10 text-amber-400 border-amber-500/20";
                    if (t.priority === "high") priorityColor = "bg-red-500/10 text-red-400 border-red-500/20";

                    let deadlineHtml = "";
                    if (t.deadline) {
                        const isOverdue = t.deadline < todayStr && !t.completedAt;
                        const deadlineColor = isOverdue ? "text-red-400 font-bold animate-pulse" : "text-slate-400";
                        deadlineHtml = `<span class="${deadlineColor}" title="Deadline"><i class="fa-regular fa-clock mr-1"></i>${formatDate(t.deadline)}</span>`;
                    }

                    const ticketColor = t.color || "#38bdf8";
                    let tagsHtml = "";
                    if (t.tags && t.tags.length > 0) {
                        tagsHtml = `<div class="flex gap-1 flex-wrap my-1.5">` + 
                            t.tags.map(tg => `<span class="text-[10px] px-1.5 py-0.5 rounded bg-dark-700/80 text-cyan-300 border border-cyan-500/20">#${tg}</span>`).join("") + 
                            `</div>`;
                    }

                    const commentCount = t.comments ? t.comments.length : 0;

                    let mobileControls = `
                        <div class="flex items-center gap-1" onclick="event.stopPropagation()">
                            ${index > 0 ? `<button onclick="moveTicketDirection('${t.id}', -1)" title="Posunout doleva" class="bg-dark-700/60 hover:bg-dark-700 text-slate-300 px-2 py-0.5 rounded text-xs"><i class="fa-solid fa-arrow-left"></i></button>` : ''}
                            ${index < appData.columns.length - 1 ? `<button onclick="moveTicketDirection('${t.id}', 1)" title="Posunout doprava" class="bg-dark-700/60 hover:bg-dark-700 text-slate-300 px-2 py-0.5 rounded text-xs"><i class="fa-solid fa-arrow-right"></i></button>` : ''}
                        </div>
                    `;

                    ticketsHtml += `
                        <div draggable="true" 
                             ondragstart="dragTicketStart(event, '${t.id}')" 
                             ondragover="dragTicketOver(event)" 
                             ondragleave="dragTicketLeave(event)"
                             ondrop="dropTicketOverTicket(event, '${t.id}', '${col.id}')"
                             style="border-left: 5px solid ${ticketColor}; background: linear-gradient(90deg, ${ticketColor}15 0%, rgba(15, 23, 42, 1) 100%);"
                             class="ticket-card bg-dark-900 border border-dark-700 p-4 rounded-xl shadow-md cursor-pointer group relative" 
                             onclick="openEditModal('${t.id}')">
                            <div class="flex justify-between items-start mb-1">
                                <span class="text-[10px] px-2 py-0.5 rounded-md border ${priorityColor} font-semibold uppercase tracking-wider">${t.priority}</span>
                                <div class="flex items-center gap-2">
                                    ${mobileControls}
                                    <button onclick="event.stopPropagation(); deleteTicket('${t.id}')" class="text-slate-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition"><i class="fa-solid fa-xmark"></i></button>
                                </div>
                            </div>
                            <h3 class="font-semibold text-sm text-white mb-1">${t.title}</h3>
                            ${t.description ? `<p class="text-xs text-slate-400 mb-2 line-clamp-2">${t.description}</p>` : ''}
                            
                            ${tagsHtml}

                            <div class="space-y-1 my-2 pt-2 border-t border-dark-700/50 text-[11px] text-slate-400">
                                ${t.deadline ? `
                                <div class="flex justify-between items-center">
                                    <span><i class="fa-solid fa-hourglass-half mr-1"></i>Deadline:</span>
                                    ${deadlineHtml}
                                </div>` : ''}
                                ${t.completedAt ? `
                                <div class="flex justify-between items-center text-emerald-400 font-medium">
                                    <span><i class="fa-regular fa-circle-check mr-1"></i>Splněno:</span>
                                    <span>${formatDate(t.completedAt)}</span>
                                </div>` : ''}
                            </div>

                            <div class="flex justify-between items-center text-xs text-slate-500 mt-2 pt-2 border-t border-dark-700/50">
                                <span><i class="fa-solid fa-user mr-1"></i>${t.assignee || 'Nikdo'}</span>
                                <div class="flex items-center gap-2">
                                    ${commentCount > 0 ? `<span class="text-[10px] text-slate-400"><i class="fa-regular fa-comment mr-1"></i>${commentCount}</span>` : ''}
                                    <span class="text-[10px] text-slate-600">#${t.id}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
                ticketsHtml += `</div>`;

                colDiv.innerHTML = headerHtml + ticketsHtml;
                board.appendChild(colDiv);
            });
        }

        function enableColumnRename(colId) {
            const col = appData.columns.find(c => c.id === colId);
            if (!col) return;
            const titleEl = document.getElementById(`col-title-${colId}`);
            
            const input = document.createElement("input");
            input.type = "text";
            input.value = col.title;
            input.className = "bg-dark-900 border border-cyan-500 rounded px-2 py-0.5 text-sm text-white focus:outline-none w-full";
            
            const saveRename = () => {
                const newTitle = input.value.trim();
                if (newTitle) {
                    col.title = newTitle;
                    saveData();
                } else {
                    renderBoard();
                }
            };

            input.addEventListener("blur", saveRename);
            input.addEventListener("keydown", (e) => {
                if (e.key === "Enter") saveRename();
                if (e.key === "Escape") renderBoard();
            });

            titleEl.replaceWith(input);
            input.focus();
        }

        let draggedTicketId = null;
        function dragTicketStart(e, id) { draggedTicketId = id; e.stopPropagation(); }
        function allowDrop(e) { e.preventDefault(); e.currentTarget.classList.add("drag-over"); }
        function removeDropStyle(e) { e.currentTarget.classList.remove("drag-over"); }
        function dragTicketOver(e) { e.preventDefault(); e.stopPropagation(); e.currentTarget.classList.add("ticket-drag-over"); }
        function dragTicketLeave(e) { e.currentTarget.classList.remove("ticket-drag-over"); }

        function dropTicketOverTicket(e, targetTicketId, targetColId) {
            e.preventDefault(); e.stopPropagation();
            e.currentTarget.classList.remove("ticket-drag-over");
            if (!draggedTicketId || draggedTicketId === targetTicketId) return;

            const draggedIdx = appData.tickets.findIndex(t => t.id === draggedTicketId);
            const targetIdx = appData.tickets.findIndex(t => t.id === targetTicketId);

            if (draggedIdx >= 0 && targetIdx >= 0) {
                const draggedTicket = appData.tickets[draggedIdx];
                const oldCol = appData.columns.find(c => c.id === draggedTicket.columnId)?.title;
                draggedTicket.columnId = targetColId;
                const newCol = appData.columns.find(c => c.id === targetColId)?.title;

                if (oldCol !== newCol) {
                    addHistory(draggedTicket, `Přesunuto ze sloupce "${oldCol}" do "${newCol}"`);
                }

                checkCompletionStatus(draggedTicket, targetColId);

                appData.tickets.splice(draggedIdx, 1);
                const newTargetIdx = appData.tickets.findIndex(t => t.id === targetTicketId);
                appData.tickets.splice(newTargetIdx, 0, draggedTicket);
                saveData();
            }
            draggedTicketId = null;
        }

        function dropTicket(e, targetColId) {
            e.preventDefault();
            e.currentTarget.classList.remove("drag-over");
            if (!draggedTicketId) return;

            const ticket = appData.tickets.find(t => t.id === draggedTicketId);
            if (ticket) {
                const oldCol = appData.columns.find(c => c.id === ticket.columnId)?.title;
                ticket.columnId = targetColId;
                const newCol = appData.columns.find(c => c.id === targetColId)?.title;

                if (oldCol !== newCol) {
                    addHistory(ticket, `Přesunuto ze sloupce "${oldCol}" do "${newCol}"`);
                }

                checkCompletionStatus(ticket, targetColId);
                saveData();
            }
            draggedTicketId = null;
        }

        function checkCompletionStatus(ticket, columnId) {
            const col = appData.columns.find(c => c.id === columnId);
            if (col) {
                const titleLower = col.title.toLowerCase();
                if (titleLower.includes("done") || titleLower.includes("hotovo")) {
                    if (!ticket.completedAt) {
                        ticket.completedAt = new Date().toISOString().split('T')[0];
                        addHistory(ticket, "Označeno jako dokončené");
                    }
                } else {
                    ticket.completedAt = null;
                }
            }
        }

        function addHistory(ticket, text) {
            if (!ticket.history) ticket.history = [];
            ticket.history.unshift({ text, time: nowFormatted() });
        }

        function moveColumnIndex(colId, direction) {
            const idx = appData.columns.findIndex(c => c.id === colId);
            if (idx < 0) return;
            const newIdx = idx + direction;
            if (newIdx < 0 || newIdx >= appData.columns.length) return;

            const item = appData.columns.splice(idx, 1)[0];
            appData.columns.splice(newIdx, 0, item);
            saveData();
        }

        function moveColumnOrder(draggedId, targetId) {
            const fromIdx = appData.columns.findIndex(c => c.id === draggedId);
            const toIdx = appData.columns.findIndex(c => c.id === targetId);
            if (fromIdx < 0 || toIdx < 0) return;

            const item = appData.columns.splice(fromIdx, 1)[0];
            appData.columns.splice(toIdx, 0, item);
            saveData();
        }

        function openModal() {
            document.getElementById("modal-title").innerText = "Nový ticket";
            document.getElementById("ticket-id").value = "";
            document.getElementById("ticket-title-input").value = "";
            document.getElementById("ticket-desc-input").value = "";
            document.getElementById("ticket-assignee-input").value = "";
            document.getElementById("ticket-deadline-input").value = "";
            document.getElementById("ticket-tags-input").value = "";
            selectCustomColor("#38bdf8");
            document.getElementById("modal-extra-section").classList.add("hidden");
            document.getElementById("ticket-modal").classList.remove("hidden");
            document.getElementById("ticket-modal").classList.add("flex");
        }

        function openEditModal(id) {
            const t = appData.tickets.find(item => item.id === id);
            if (!t) return;
            document.getElementById("modal-title").innerText = "Upravit ticket";
            document.getElementById("ticket-id").value = t.id;
            document.getElementById("ticket-title-input").value = t.title;
            document.getElementById("ticket-desc-input").value = t.description || "";
            document.getElementById("ticket-priority-input").value = t.priority;
            document.getElementById("ticket-assignee-input").value = t.assignee || "";
            document.getElementById("ticket-deadline-input").value = t.deadline || "";
            document.getElementById("ticket-tags-input").value = t.tags ? t.tags.join(", ") : "";
            selectCustomColor(t.color || "#38bdf8");

            renderComments(t);
            renderHistory(t);
            document.getElementById("modal-extra-section").classList.remove("hidden");

            document.getElementById("ticket-modal").classList.remove("hidden");
            document.getElementById("ticket-modal").classList.add("flex");
        }

        function renderComments(ticket) {
            const list = document.getElementById("comments-list");
            list.innerHTML = "";
            if (ticket.comments && ticket.comments.length > 0) {
                ticket.comments.forEach(c => {
                    list.innerHTML += `
                        <div class="bg-dark-900 border border-dark-700/60 p-2 rounded-xl text-xs">
                            <p class="text-slate-200">${c.text}</p>
                            <span class="text-[10px] text-slate-500">${c.time}</span>
                        </div>`;
                });
            } else {
                list.innerHTML = `<span class="text-xs text-slate-500 italic">Zatím žádné komentáře.</span>`;
            }
        }

        function addComment() {
            const id = document.getElementById("ticket-id").value;
            const input = document.getElementById("new-comment-input");
            const text = input.value.trim();
            if (!id || !text) return;

            const t = appData.tickets.find(item => item.id === id);
            if (t) {
                if (!t.comments) t.comments = [];
                t.comments.push({ text, time: nowFormatted() });
                addHistory(t, `Přidán komentář: "${text.substring(0, 20)}..."`);
                input.value = "";
                renderComments(t);
                saveData();
            }
        }

        function renderHistory(ticket) {
            const list = document.getElementById("history-list");
            list.innerHTML = "";
            if (ticket.history && ticket.history.length > 0) {
                ticket.history.forEach(h => {
                    list.innerHTML += `
                        <div class="flex justify-between items-center border-b border-dark-700/30 pb-1">
                            <span>${h.text}</span>
                            <span class="text-[9px] text-slate-500">${h.time}</span>
                        </div>`;
                });
            } else {
                list.innerHTML = `<span class="text-xs text-slate-500 italic">Žádná historie.</span>`;
            }
        }

        function closeModal() {
            document.getElementById("ticket-modal").classList.remove("flex");
            document.getElementById("ticket-modal").classList.add("hidden");
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById("ticket-id").value;
            const title = document.getElementById("ticket-title-input").value;
            const description = document.getElementById("ticket-desc-input").value;
            const priority = document.getElementById("ticket-priority-input").value;
            const assignee = document.getElementById("ticket-assignee-input").value;
            const deadline = document.getElementById("ticket-deadline-input").value || null;
            const color = selectedColorHex;

            const rawTags = document.getElementById("ticket-tags-input").value;
            const tags = rawTags ? rawTags.split(",").map(t => t.trim()).filter(t => t.length > 0) : [];

            if (id) {
                const t = appData.tickets.find(item => item.id === id);
                if (t) {
                    t.title = title;
                    t.description = description;
                    t.priority = priority;
                    t.assignee = assignee;
                    t.deadline = deadline;
                    t.color = color;
                    t.tags = tags;
                    addHistory(t, "Ticket upraven");
                }
            } else {
                const today = new Date().toISOString().split('T')[0];
                const newTicket = {
                    id: "t-" + Date.now(),
                    columnId: appData.columns[0].id,
                    title, description, priority, assignee, deadline, color, tags,
                    createdAt: today,
                    completedAt: null,
                    comments: [],
                    history: [{ text: "Ticket vytvořen", time: nowFormatted() }]
                };
                appData.tickets.push(newTicket);
            }

            closeModal();
            saveData();
        }

        function deleteTicket(id) {
            appData.tickets = appData.tickets.filter(t => t.id !== id);
            saveData();
        }

        function openColumnModal() {
            document.getElementById("column-title-input").value = "";
            document.getElementById("column-modal").classList.remove("hidden");
            document.getElementById("column-modal").classList.add("flex");
        }
        function closeColumnModal() {
            document.getElementById("column-modal").classList.remove("flex");
            document.getElementById("column-modal").classList.add("hidden");
        }

        function promptDeleteColumn(colId) {
            document.getElementById("delete-column-id").value = colId;
            const select = document.getElementById("transfer-target-select");
            select.innerHTML = "";
            appData.columns.forEach(c => {
                if (c.id !== colId) select.innerHTML += `<option value="${c.id}">${c.title}</option>`;
            });
            document.getElementById("delete-column-modal").classList.remove("hidden");
            document.getElementById("delete-column-modal").classList.add("flex");
        }
        function closeDeleteColumnModal() {
            document.getElementById("delete-column-modal").classList.remove("flex");
            document.getElementById("delete-column-modal").classList.add("hidden");
        }
        function confirmDeleteColumn(action) {
            const colId = document.getElementById("delete-column-id-value") || document.getElementById("delete-column-id").value;
            if (action === 'delete') {
                appData.tickets = appData.tickets.filter(t => t.columnId !== colId);
            } else if (action === 'transfer') {
                const targetColId = document.getElementById("transfer-target-select").value;
                appData.tickets.forEach(t => {
                    if (t.columnId === colId) {
                        t.columnId = targetColId;
                        checkCompletionStatus(t, targetColId);
                    }
                });
            }
            appData.columns = appData.columns.filter(c => c.id !== colId);
            closeDeleteColumnModal();
            saveData();
        }

        // Spuštění kontroly autentizace
        checkAuth();
    </script>
</body>
</html>
